<!DOCTYPE html>
<html lang="uz">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>NAZZARO — Erkaklar ustki kiyimlari</title>
<meta name="description" content="NAZZARO — tabiiy mo'ynali yoqali charm va zamsh kurtka hamda paltolar. Tayyor kolleksiya va individual buyurtma.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@400;500;600&family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet">
<style>
:root{
  --ink:#141414; --muted:#6b6b6b; --line:#e6e3de; --bg:#ffffff; --soft:#f6f4f0; --gold:#a8865a;
  --serif:"Cormorant Garamond",Georgia,serif; --sans:"Inter",system-ui,-apple-system,sans-serif;
}
*{box-sizing:border-box;margin:0;padding:0}
html{scroll-behavior:smooth}
body{font-family:var(--sans);color:var(--ink);background:var(--bg);font-size:15px;line-height:1.6;-webkit-font-smoothing:antialiased}
img{display:block;max-width:100%}
a{color:inherit;text-decoration:none}
button{font:inherit;cursor:pointer;border:0;background:none;color:inherit}
.wrap{max-width:1320px;margin:0 auto;padding:0 32px}

/* top bar */
.topbar{background:var(--ink);color:#fff;text-align:center;font-size:12px;letter-spacing:.08em;padding:9px 16px}

/* header */
header{position:sticky;top:0;z-index:50;background:rgba(255,255,255,.96);backdrop-filter:blur(8px);border-bottom:1px solid var(--line)}
.nav{display:flex;align-items:center;justify-content:space-between;height:72px}
.logo{display:flex;align-items:center;gap:10px;font-family:var(--serif);font-size:26px;font-weight:600;letter-spacing:.32em}
.logo svg{width:26px;height:26px}
.menu{display:flex;gap:36px;font-size:13px;letter-spacing:.06em;text-transform:uppercase}
.menu a{position:relative;padding:6px 0}
.menu a::after{content:"";position:absolute;left:0;bottom:0;width:0;height:1px;background:var(--ink);transition:width .25s}
.menu a:hover::after{width:100%}
.nav-cta{font-size:13px;letter-spacing:.06em;text-transform:uppercase;border:1px solid var(--ink);padding:10px 20px;transition:.2s}
.nav-cta:hover{background:var(--ink);color:#fff}
.burger{display:none;width:28px;height:20px;position:relative}
.burger span{position:absolute;left:0;right:0;height:1.5px;background:var(--ink);transition:.25s}
.burger span:nth-child(1){top:2px}.burger span:nth-child(2){top:9px}.burger span:nth-child(3){top:16px}
.burger.open span:nth-child(1){top:9px;transform:rotate(45deg)}
.burger.open span:nth-child(2){opacity:0}
.burger.open span:nth-child(3){top:9px;transform:rotate(-45deg)}

/* hero */
.hero{display:grid;grid-template-columns:1fr 1fr;min-height:calc(100vh - 106px);max-height:860px}
.hero-text{display:flex;flex-direction:column;justify-content:center;padding:64px 64px 64px 32px;max-width:680px;margin-left:auto}
.eyebrow{font-size:12px;letter-spacing:.22em;text-transform:uppercase;color:var(--gold);margin-bottom:22px}
h1{font-family:var(--serif);font-weight:400;font-size:clamp(44px,5.4vw,80px);line-height:1.02;margin-bottom:26px}
h1 em{font-style:italic}
.lead{color:var(--muted);font-size:17px;max-width:440px;margin-bottom:38px}
.btns{display:flex;gap:14px;flex-wrap:wrap}
.btn{display:inline-flex;align-items:center;gap:10px;padding:16px 30px;font-size:13px;letter-spacing:.1em;text-transform:uppercase;transition:.2s}
.btn-dark{background:var(--ink);color:#fff}
.btn-dark:hover{background:#333}
.btn-line{border:1px solid var(--ink)}
.btn-line:hover{background:var(--ink);color:#fff}
.hero-img{position:relative;overflow:hidden;background:#1b1712}
.hero-img img{width:100%;height:100%;object-fit:cover;object-position:center 30%}
.hero-tag{position:absolute;left:24px;bottom:24px;background:#fff;padding:14px 18px;font-size:13px}
.hero-tag b{display:block;font-family:var(--serif);font-size:20px;font-weight:500}

/* features strip */
.strip{border-top:1px solid var(--line);border-bottom:1px solid var(--line)}
.strip .wrap{display:grid;grid-template-columns:repeat(4,1fr)}
.strip div.item{padding:26px 20px;text-align:center;font-size:13px;color:var(--muted);border-right:1px solid var(--line)}
.strip div.item:last-child{border-right:0}
.strip b{display:block;color:var(--ink);font-weight:500;font-size:14px;margin-bottom:2px}

/* sections */
section.block{padding:110px 0}
.head{display:flex;justify-content:space-between;align-items:flex-end;gap:24px;margin-bottom:44px;flex-wrap:wrap}
h2{font-family:var(--serif);font-weight:400;font-size:clamp(34px,3.6vw,52px);line-height:1.1}
.sub{color:var(--muted);max-width:440px}

/* filters */
.filters{display:flex;gap:8px;flex-wrap:wrap}
.chip{padding:9px 18px;border:1px solid var(--line);font-size:13px;border-radius:40px;transition:.2s}
.chip:hover{border-color:var(--ink)}
.chip.active{background:var(--ink);color:#fff;border-color:var(--ink)}

/* grid */
.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:40px 20px}
.card{cursor:pointer}
.card .ph{position:relative;aspect-ratio:3/4;overflow:hidden;background:var(--soft)}
.card .ph img{width:100%;height:100%;object-fit:cover;transition:opacity .5s,transform .8s}
.card .ph img.alt{position:absolute;inset:0;opacity:0}
.card:hover .ph img.main{transform:scale(1.04)}
.card:hover .ph img.alt{opacity:1}
.badge{position:absolute;top:12px;left:12px;background:#fff;font-size:11px;letter-spacing:.1em;text-transform:uppercase;padding:5px 10px}
.quick{position:absolute;left:12px;right:12px;bottom:12px;background:rgba(255,255,255,.95);text-align:center;padding:12px;font-size:12px;letter-spacing:.1em;text-transform:uppercase;transform:translateY(130%);transition:.3s}
.card:hover .quick{transform:none}
.card .meta{padding-top:14px}
.card .name{font-size:15px;font-weight:500}
.card .code{font-size:13px;color:var(--muted)}
.swatches{display:flex;gap:6px;margin-top:10px}
.sw{width:14px;height:14px;border-radius:50%;border:1px solid rgba(0,0,0,.15)}

/* custom made */
.custom{background:var(--soft)}
.custom-grid{display:grid;grid-template-columns:1fr 1fr;gap:80px;align-items:center}
.custom-img{aspect-ratio:4/5;overflow:hidden}
.custom-img img{width:100%;height:100%;object-fit:cover}
.steps{margin:38px 0 40px;border-top:1px solid #d8d3cb}
.step{display:grid;grid-template-columns:56px 1fr;padding:22px 0;border-bottom:1px solid #d8d3cb}
.step .n{font-family:var(--serif);font-size:28px;color:var(--gold);line-height:1}
.step h3{font-size:16px;font-weight:500;margin-bottom:4px}
.step p{color:var(--muted);font-size:14px}

/* materials */
.mat-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:20px}
.mat{position:relative;aspect-ratio:4/5;overflow:hidden;color:#fff}
.mat img{width:100%;height:100%;object-fit:cover;transition:transform .8s}
.mat:hover img{transform:scale(1.05)}
.mat::after{content:"";position:absolute;inset:0;background:linear-gradient(transparent 45%,rgba(0,0,0,.72))}
.mat .t{position:absolute;left:28px;right:28px;bottom:26px;z-index:2}
.mat h3{font-family:var(--serif);font-weight:400;font-size:32px;margin-bottom:4px}
.mat p{font-size:14px;opacity:.85}

/* about */
.about{display:grid;grid-template-columns:1.1fr 1fr;gap:80px;align-items:center}
.about p{color:var(--muted);margin-bottom:18px;font-size:16px}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:20px;margin-top:36px;border-top:1px solid var(--line);padding-top:28px}
.stats b{font-family:var(--serif);font-size:40px;font-weight:400;display:block;line-height:1.1}
.stats span{font-size:13px;color:var(--muted)}
.about-imgs{display:grid;grid-template-columns:1fr 1fr;gap:16px}
.about-imgs img{aspect-ratio:3/4;object-fit:cover;width:100%}
.about-imgs img:last-child{margin-top:60px}

/* contact */
.contact{background:var(--ink);color:#fff}
.contact .sub{color:#aaa}
.contact-grid{display:grid;grid-template-columns:1fr 1.2fr;gap:80px}
.info-row{padding:20px 0;border-bottom:1px solid #333}
.info-row small{display:block;font-size:11px;letter-spacing:.16em;text-transform:uppercase;color:#888;margin-bottom:4px}
.info-row span{font-size:16px}
form{display:grid;grid-template-columns:1fr 1fr;gap:18px}
.field{display:flex;flex-direction:column;gap:6px}
.field.full{grid-column:1/-1}
label{font-size:11px;letter-spacing:.16em;text-transform:uppercase;color:#999}
input,select,textarea{font:inherit;font-size:15px;color:#fff;background:transparent;border:0;border-bottom:1px solid #444;padding:10px 0;outline:none;transition:border-color .2s;border-radius:0}
select option{color:#000}
input:focus,select:focus,textarea:focus{border-color:#fff}
textarea{resize:vertical;min-height:80px}
.btn-light{background:#fff;color:var(--ink);justify-content:center}
.btn-light:hover{background:#ddd}
.result{grid-column:1/-1;display:none;border:1px solid #444;padding:20px;font-size:14px;color:#ccc}
.result.show{display:block}
.result pre{white-space:pre-wrap;font-family:var(--sans);color:#fff;background:#1f1f1f;padding:14px;margin:12px 0;font-size:13px}
.result .acts{display:flex;gap:10px;flex-wrap:wrap}
.result .acts a,.result .acts button{border:1px solid #666;padding:10px 16px;font-size:12px;letter-spacing:.08em;text-transform:uppercase}
.result .acts a:hover,.result .acts button:hover{background:#fff;color:var(--ink)}

footer{background:#0c0c0c;color:#888;font-size:13px;padding:56px 0 30px}
.foot{display:grid;grid-template-columns:2fr 1fr 1fr 1fr;gap:40px;padding-bottom:40px;border-bottom:1px solid #222}
footer .logo{color:#fff;margin-bottom:14px}
footer h4{color:#fff;font-weight:500;font-size:12px;letter-spacing:.14em;text-transform:uppercase;margin-bottom:14px}
footer li{list-style:none;margin-bottom:8px}
footer a:hover{color:#fff}
.copy{padding-top:24px;display:flex;justify-content:space-between;flex-wrap:wrap;gap:10px}

/* modal */
.modal{position:fixed;inset:0;z-index:100;display:none}
.modal.open{display:block}
.backdrop{position:absolute;inset:0;background:rgba(0,0,0,.5);animation:fade .25s}
.panel{position:absolute;top:0;right:0;bottom:0;width:min(1040px,100%);background:#fff;display:grid;grid-template-columns:1.1fr 1fr;animation:slide .35s cubic-bezier(.2,.8,.2,1);overflow:hidden}
@keyframes fade{from{opacity:0}}
@keyframes slide{from{transform:translateX(40px);opacity:0}}
.gallery{background:var(--soft);display:flex;flex-direction:column;min-height:0}
.gallery .big{flex:1;min-height:0}
.gallery .big img{width:100%;height:100%;object-fit:contain}
.thumbs{display:flex;gap:8px;padding:12px;background:#fff;border-top:1px solid var(--line);overflow-x:auto}
.thumbs img{width:58px;height:76px;object-fit:cover;cursor:pointer;opacity:.5;border:1px solid transparent}
.thumbs img.on{opacity:1;border-color:var(--ink)}
.details{padding:48px 44px;overflow-y:auto}
.close{position:absolute;top:16px;right:18px;width:40px;height:40px;font-size:26px;line-height:1;z-index:3;background:#fff;border-radius:50%}
.details .code{color:var(--muted);font-size:13px;letter-spacing:.08em}
.details h3{font-family:var(--serif);font-weight:400;font-size:38px;line-height:1.1;margin:6px 0 16px}
.details .desc{color:var(--muted);margin-bottom:26px}
.opt-label{font-size:12px;letter-spacing:.12em;text-transform:uppercase;margin-bottom:10px;display:flex;justify-content:space-between}
.opt-label span{color:var(--muted);text-transform:none;letter-spacing:0}
.colors{display:flex;gap:10px;margin-bottom:26px}
.colors button{width:34px;height:34px;border-radius:50%;border:1px solid rgba(0,0,0,.2);outline-offset:3px}
.colors button.on{outline:1px solid var(--ink)}
.sizes{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-bottom:28px}
.sizes button{border:1px solid var(--line);padding:11px 0;font-size:14px}
.sizes button:hover{border-color:var(--ink)}
.sizes button.on{background:var(--ink);color:#fff;border-color:var(--ink)}
.details .btn{width:100%;justify-content:center;margin-bottom:10px}
.spec{margin-top:24px;border-top:1px solid var(--line)}
.spec li{list-style:none;display:flex;justify-content:space-between;padding:12px 0;border-bottom:1px solid var(--line);font-size:14px}
.spec li span:first-child{color:var(--muted)}
.hint{font-size:12px;color:#b04a3a;margin:-18px 0 18px;min-height:0;display:none}

.reveal{opacity:0;transform:translateY(24px);transition:opacity .8s,transform .8s}
.reveal.in{opacity:1;transform:none}

/* responsive */
@media (max-width:1100px){
  .grid{grid-template-columns:repeat(3,1fr)}
  .menu{gap:22px}
}
@media (max-width:900px){
  .wrap{padding:0 20px}
  .menu,.nav-cta{display:none}
  .burger{display:block}
  .menu.mobile{display:flex;flex-direction:column;position:absolute;top:72px;left:0;right:0;background:#fff;padding:20px;gap:6px;border-bottom:1px solid var(--line)}
  .menu.mobile a{padding:12px 0;font-size:15px}
  .hero{grid-template-columns:1fr;max-height:none;min-height:0}
  .hero-img{order:-1;aspect-ratio:4/5;max-height:72vh}
  .hero-text{padding:44px 20px 56px;margin:0}
  .strip .wrap{grid-template-columns:1fr 1fr;padding:0}
  .strip div.item:nth-child(2){border-right:0}
  .strip div.item:nth-child(-n+2){border-bottom:1px solid var(--line)}
  section.block{padding:72px 0}
  .grid{grid-template-columns:1fr 1fr;gap:28px 12px}
  .quick{display:none}
  .custom-grid,.about,.contact-grid{grid-template-columns:1fr;gap:44px}
  .mat-grid{grid-template-columns:1fr}
  .mat{aspect-ratio:16/11}
  .foot{grid-template-columns:1fr 1fr}
  .panel{grid-template-columns:1fr;overflow-y:auto;display:block}
  .gallery .big{height:62vh}
  .details{padding:30px 20px 40px;overflow:visible}
  form{grid-template-columns:1fr}
}
.langs{display:flex;gap:2px;border:1px solid var(--line);border-radius:40px;padding:3px}
.langs button{font-size:12px;font-weight:500;letter-spacing:.06em;padding:6px 10px;border-radius:40px;color:var(--muted);transition:.2s}
.langs button:hover{color:var(--ink)}
.langs button.on{background:var(--ink);color:#fff}
.nav-right{display:flex;align-items:center;gap:14px}
@media (max-width:900px){.langs button{padding:5px 7px;font-size:11px}.nav-right{gap:12px}.logo{font-size:19px;letter-spacing:.2em;gap:7px}.logo svg{width:18px;height:18px}}
</style>
</head>
<body>

<div class="topbar" data-i18n="topbar"></div>

<header>
  <div class="wrap nav">
    <a href="#top" class="logo" aria-label="NAZZARO">
      <svg viewBox="0 0 26 26" fill="none" stroke="currentColor" stroke-width="1.6"><path d="M5 22V5l16 16V4"/></svg>
      NAZZARO
    </a>
    <nav class="menu" id="menu">
      <a href="#kolleksiya" data-i18n="nav_collection"></a>
      <a href="#buyurtma" data-i18n="nav_custom"></a>
      <a href="#materiallar" data-i18n="nav_materials"></a>
      <a href="#biz-haqimizda" data-i18n="nav_about"></a>
      <a href="#aloqa" data-i18n="nav_contact"></a>
    </nav>
    <div class="nav-right">
      <div class="langs" id="langs">
        <button data-lang="uz">UZ</button><button data-lang="ru">RU</button><button data-lang="en">EN</button>
      </div>
      <a href="#aloqa" class="nav-cta" data-i18n="cta_book"></a>
      <button class="burger" id="burger" aria-label="Menu"><span></span><span></span><span></span></button>
    </div>
  </div>
</header>

<main id="top">
  <section class="hero">
    <div class="hero-text reveal">
      <div class="eyebrow" data-i18n="hero_eyebrow"></div>
      <h1 data-i18n-html="hero_title"></h1>
      <p class="lead" data-i18n="hero_lead"></p>
      <div class="btns">
        <a href="#kolleksiya" class="btn btn-dark" data-i18n="hero_btn1"></a>
        <a href="#buyurtma" class="btn btn-line" data-i18n="nav_custom"></a>
      </div>
    </div>
    <div class="hero-img">
      <img src="img/151.jpg" alt="NAZZARO N-151">
      <div class="hero-tag"><span data-i18n="hero_tag"></span><b data-i18n="hero_tag_name"></b></div>
    </div>
  </section>

  <div class="strip">
    <div class="wrap">
      <div class="item"><b data-i18n="f1_t"></b><span data-i18n="f1_d"></span></div>
      <div class="item"><b data-i18n="f2_t"></b><span data-i18n="f2_d"></span></div>
      <div class="item"><b data-i18n="f3_t"></b><span data-i18n="f3_d"></span></div>
      <div class="item"><b data-i18n="f4_t"></b><span data-i18n="f4_d"></span></div>
    </div>
  </div>

  <section class="block" id="kolleksiya">
    <div class="wrap">
      <div class="head reveal">
        <div>
          <div class="eyebrow" data-i18n="nav_collection"></div>
          <h2 data-i18n="col_title"></h2>
        </div>
        <div class="filters" id="filters">
          <button class="chip active" data-f="all" data-i18n="flt_all"></button>
          <button class="chip" data-f="charm" data-i18n="flt_leather"></button>
          <button class="chip" data-f="zamsh" data-i18n="flt_suede"></button>
          <button class="chip" data-f="palto" data-i18n="flt_coats"></button>
          <button class="chip" data-f="kurtka" data-i18n="flt_jackets"></button>
        </div>
      </div>
      <div class="grid" id="grid"></div>
    </div>
  </section>

  <section class="block custom" id="buyurtma">
    <div class="wrap custom-grid">
      <div class="custom-img reveal"><img src="img/001-b.jpg" alt="NAZZARO made to measure"></div>
      <div class="reveal">
        <div class="eyebrow">Made to measure</div>
        <h2 data-i18n="cm_title"></h2>
        <p class="sub" style="margin-top:16px" data-i18n="cm_sub"></p>
        <div class="steps">
          <div class="step"><div class="n">01</div><div><h3 data-i18n="s1_t"></h3><p data-i18n="s1_d"></p></div></div>
          <div class="step"><div class="n">02</div><div><h3 data-i18n="s2_t"></h3><p data-i18n="s2_d"></p></div></div>
          <div class="step"><div class="n">03</div><div><h3 data-i18n="s3_t"></h3><p data-i18n="s3_d"></p></div></div>
          <div class="step"><div class="n">04</div><div><h3 data-i18n="s4_t"></h3><p data-i18n="s4_d"></p></div></div>
        </div>
        <a href="#aloqa" class="btn btn-dark" data-i18n="cta_book_arrow"></a>
      </div>
    </div>
  </section>

  <section class="block" id="materiallar">
    <div class="wrap">
      <div class="head reveal">
        <div><div class="eyebrow" data-i18n="nav_materials"></div><h2 data-i18n="mat_title"></h2></div>
        <p class="sub" data-i18n="mat_sub"></p>
      </div>
      <div class="mat-grid">
        <div class="mat reveal"><img src="img/131.jpg" alt=""><div class="t"><h3 data-i18n="m1_t"></h3><p data-i18n="m1_d"></p></div></div>
        <div class="mat reveal"><img src="img/043.jpg" alt=""><div class="t"><h3 data-i18n="m2_t"></h3><p data-i18n="m2_d"></p></div></div>
        <div class="mat reveal"><img src="img/141.jpg" alt=""><div class="t"><h3 data-i18n="m3_t"></h3><p data-i18n="m3_d"></p></div></div>
      </div>
    </div>
  </section>

  <section class="block" id="biz-haqimizda" style="padding-top:0">
    <div class="wrap about">
      <div class="reveal">
        <div class="eyebrow" data-i18n="nav_about"></div>
        <h2 data-i18n="ab_title"></h2>
        <p style="margin-top:20px" data-i18n="ab_p1"></p>
        <p data-i18n="ab_p2"></p>
        <div class="stats">
          <div><b>100%</b><span data-i18n="st1"></span></div>
          <div><b>46–60</b><span data-i18n="st2"></span></div>
          <div><b>4</b><span data-i18n="st3"></span></div>
        </div>
      </div>
      <div class="about-imgs reveal">
        <img src="img/001-c.jpg" alt="">
        <img src="img/003-b.jpg" alt="">
      </div>
    </div>
  </section>

  <section class="block contact" id="aloqa">
    <div class="wrap contact-grid">
      <div class="reveal">
        <div class="eyebrow" data-i18n="nav_contact"></div>
        <h2 data-i18n="ct_title"></h2>
        <p class="sub" style="margin-top:16px" data-i18n="ct_sub"></p>
        <div style="margin-top:30px">
          <div class="info-row"><small data-i18n="ct_phone"></small><span>+998 (__) ___-__-__</span></div>
          <div class="info-row"><small>Telegram</small><span>@nazzaro_uz</span></div>
          <div class="info-row"><small data-i18n="ct_addr"></small><span data-i18n="ct_addr_v"></span></div>
          <div class="info-row"><small data-i18n="ct_hours"></small><span data-i18n="ct_hours_v"></span></div>
        </div>

  en:{n:"Suede coat with leather trim",d:"A suede coat with leather trim across the chest. Sharp silhouette, fur lapels.",m:"Suede + leather trim",c:"Fur lapels",f:"3 buttons"}}
];
const src=n=>`img/${n}.jpg`;
const $=s=>document.querySelector(s);
let lang="uz",filter="all";
try{const s=localStorage.getItem("nazzaro_lang");if(T[s])lang=s}catch(e){}
const t=k=>T[lang][k];
const P=p=>p[lang];
const code=(p,c)=>"N-"+(c.code||p.id);
const optLabel=(p,c)=>`${code(p,c)} — ${P(p).n} (${t("colors")[c.c]})`;

function applyLang(){
  document.documentElement.lang=lang;document.title=t("title");
  document.querySelectorAll("[data-i18n]").forEach(el=>el.textContent=t(el.dataset.i18n));
  document.querySelectorAll("[data-i18n-html]").forEach(el=>el.innerHTML=t(el.dataset.i18nHtml));
  document.querySelectorAll("[data-i18n-ph]").forEach(el=>el.placeholder=t(el.dataset.i18nPh));
  document.querySelectorAll("#langs button").forEach(b=>b.classList.toggle("on",b.dataset.lang===lang));
  // form selects
  const fm=$("#f-model"),fs=$("#f-size"),ft=$("#f-type");
  const mi=fm.selectedIndex,si=fs.selectedIndex,ti=Math.max(ft.selectedIndex,0);
  fm.innerHTML=`<option value="">${t("fm_no_model")}</option>`+PRODUCTS.flatMap(p=>p.colors.map(c=>`<option>${optLabel(p,c)}</option>`)).join("");
  fs.innerHTML=`<option value="">${t("fm_no_size")}</option>`+SIZES.map(s=>`<option>${s}</option>`).join("");
  ft.innerHTML=t("types").map(x=>`<option>${x}</option>`).join("");
  if(mi>0)fm.selectedIndex=mi; if(si>0)fs.selectedIndex=si; ft.selectedIndex=ti;
  render();
  if(cur)paint();
  if($("#result").classList.contains("show"))buildMsg();
}
document.querySelectorAll("#langs button").forEach(b=>b.onclick=()=>{lang=b.dataset.lang;try{localStorage.setItem("nazzaro_lang",lang)}catch(e){}applyLang()});

/* grid */
function render(){
  const g=$("#grid");g.innerHTML="";
  PRODUCTS.filter(p=>filter==="all"||p.cat.includes(filter)).forEach(p=>{
    const imgs=p.colors.flatMap(c=>c.imgs);
    const el=document.createElement("article");el.className="card";
    el.innerHTML=`<div class="ph">
      <img class="main" src="${src(imgs[0])}" alt="${P(p).n}" loading="lazy">
      ${imgs[1]?`<img class="alt" src="${src(imgs[1])}" alt="" loading="lazy">`:""}
      ${p.badge?`<span class="badge">${t("badges")[p.badge]}</span>`:""}
      <span class="quick">${t("card_more")}</span></div>
      <div class="meta"><div class="name">${P(p).n}</div><div class="code">${t("card_model")} N-${p.colors.map(c=>c.code||p.id).join(" / ")}</div>
      <div class="swatches">${p.colors.map(c=>`<span class="sw" style="background:${HEX[c.c]}" title="${t("colors")[c.c]}"></span>`).join("")}</div></div>`;
    el.onclick=()=>openModal(p);
    g.appendChild(el);
  });
}
function setFilter(f){filter=f;document.querySelectorAll(".chip").forEach(x=>x.classList.toggle("active",x.dataset.f===f));render()}
document.querySelectorAll(".chip").forEach(b=>b.onclick=()=>setFilter(b.dataset.f));
document.querySelectorAll("[data-go]").forEach(a=>a.addEventListener("click",()=>setFilter(a.dataset.go)));

/* modal */
let cur=null,ci=0,size=null;
function openModal(p){
  cur=p;ci=0;size=null;
  $("#m-sizes").innerHTML=SIZES.map(s=>`<button>${s}</button>`).join("");
  $("#m-sizes").querySelectorAll("button").forEach(b=>b.onclick=()=>{size=b.textContent;$("#m-hint").style.display="none";$("#m-sizes").querySelectorAll("button").forEach(x=>x.classList.toggle("on",x===b))});
  $("#m-hint").style.display="none";
  paint();
  $("#modal").classList.add("open");document.body.style.overflow="hidden";
}
function paint(){
  const p=cur,c=p.colors[ci];
  $("#m-name").textContent=P(p).n;$("#m-desc").textContent=P(p).d;
  $("#m-colors").innerHTML=p.colors.map((x,i)=>`<button style="background:${HEX[x.c]}" data-i="${i}" class="${i===ci?"on":""}" aria-label="${t("colors")[x.c]}"></button>`).join("");
  $("#m-colors").querySelectorAll("button").forEach(b=>b.onclick=()=>{ci=+b.dataset.i;paint()});
  $("#m-spec").innerHTML=`<li><span>${t("sp_material")}</span><span>${P(p).m}</span></li><li><span>${t("sp_collar")}</span><span>${P(p).c}</span></li><li><span>${t("sp_fast")}</span><span>${P(p).f}</span></li><li><span>${t("sp_sizes")}</span><span>46 — 60</span></li>`;
  $("#m-code").textContent=t("card_model").toUpperCase()+" "+code(p,c);
  $("#m-color-name").textContent=t("colors")[c.c];
  $("#m-big").src=src(c.imgs[0]);$("#m-big").alt=P(p).n;
  $("#m-thumbs").innerHTML=c.imgs.length>1?c.imgs.map((n,i)=>`<img src="${src(n)}" class="${i?"":"on"}" alt="">`).join(""):"";
  $("#m-thumbs").style.display=c.imgs.length>1?"flex":"none";
  $("#m-thumbs").querySelectorAll("img").forEach(x=>x.onclick=()=>{$("#m-big").src=x.src;$("#m-thumbs").querySelectorAll("img").forEach(y=>y.classList.toggle("on",y===x))});
}
function closeModal(){$("#modal").classList.remove("open");document.body.style.overflow="";cur=null}
document.querySelectorAll("[data-close]").forEach(e=>e.onclick=closeModal);
document.addEventListener("keydown",e=>{if(e.key==="Escape")closeModal()});
function toForm(custom){
  const label=optLabel(cur,cur.colors[ci]);
  const fm=$("#f-model");[...fm.options].forEach((o,i)=>{if(o.text===label)fm.selectedIndex=i});
  $("#f-size").value=custom?"":(size||"");
  $("#f-type").selectedIndex=custom?1:0;
  closeModal();$("#aloqa").scrollIntoView({behavior:"smooth"});
}
$("#m-order").onclick=()=>{if(!size){$("#m-hint").style.display="block";return}toForm(false)};
$("#m-custom").onclick=()=>toForm(true);

/* form */
function buildMsg(){
  const txt=`${t("msg_head")}
${t("msg_name")}: ${$("#f-name").value.trim()}
${t("ct_phone")}: ${$("#f-phone").value.trim()}
${t("msg_model")}: ${$("#f-model").value||t("msg_none")}
${t("msg_size")}: ${$("#f-size").value||t("msg_measure")}
${t("msg_type")}: ${$("#f-type").value}
${t("msg_note")}: ${$("#f-msg").value.trim()||"—"}`;
  $("#result-text").textContent=txt;
  $("#tg-link").href="https://t.me/share/url?url=&text="+encodeURIComponent(txt);
}
$("#form").addEventListener("submit",e=>{
  e.preventDefault();
  const ok=[$("#f-name"),$("#f-phone")].map(i=>{i.style.borderColor=i.value.trim()?"":"#c0563f";return !!i.value.trim()}).every(Boolean);
  if(!ok)return;
  buildMsg();$("#result").classList.add("show");$("#copy-btn").textContent=t("fm_copy");
});
$("#copy-btn").onclick=async()=>{
  try{await navigator.clipboard.writeText($("#result-text").textContent);$("#copy-btn").textContent=t("fm_copied")}
  catch(e){$("#copy-btn").textContent=t("fm_copy_fail")}
};

/* mobile menu */
$("#burger").onclick=()=>{$("#burger").classList.toggle("open");$("#menu").classList.toggle("mobile")};
document.querySelectorAll("#menu a").forEach(a=>a.addEventListener("click",()=>{$("#burger").classList.remove("open");$("#menu").classList.remove("mobile")}));

/* reveal */
const io=new IntersectionObserver(es=>es.forEach(x=>{if(x.isIntersecting){x.target.classList.add("in");io.unobserve(x.target)}}),{threshold:.12});
document.querySelectorAll(".reveal").forEach(el=>io.observe(el));

applyLang();
</script>
</body>
</html>
